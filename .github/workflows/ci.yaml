name: 🧪 CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # On main each run is that commit's verification record, so it gets a run-unique
  # group and nothing there queues behind or evicts anything else. Disabling
  # cancellation alone would not be enough: a concurrency group holds one running
  # plus one pending run, and a third push cancels the pending one, so a second
  # push's checks would still be lost. A cancelled check is not a failed check, so
  # main would report green over verification that never completed.
  #
  # Pull requests keep the ref-keyed group, so superseded runs there still cancel.
  group: "${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}"
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

jobs:
  validate-manifests:
    name: Validate manifests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 📄 Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: ✅ Validate manifests
        # Single source of truth in scripts/validate-manifests.sh (documented in
        # AGENTS.md, self-tested in the lint-scripts job) — no inline/doc drift.
        run: ./scripts/validate-manifests.sh

  lint-scripts:
    name: Lint scripts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 📄 Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: 🔧 Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: 📦 Install the locked Markdown parser
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: 🐚 ShellCheck scripts
        # Repo-level scripts plus every helper a plugin bundles, whether it sits
        # beside a skill or serves the plugin's agents. A guard that ships to
        # consumers is linted like any other script here.
        run: |
          shopt -s nullglob
          files=(scripts/*.sh plugins/*/scripts/*.sh plugins/*/skills/*/scripts/*.sh)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::Script discovery found nothing — the globs are wrong."
            exit 1
          fi
          printf 'Linting %s script(s).\n' "${#files[@]}"
          shellcheck "${files[@]}"

      - name: 🔧 Set up the minimum supported Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.22.12"
          cache: false

      - name: 🧪 Verify the optional offline autonomy consumer
        run: |
          GOENV=off GOWORK=off GO111MODULE=off GOTOOLCHAIN=local GOFLAGS='' CGO_ENABLED=0 \
            go test plugins/agentic-engineering/scripts/autonomy-contract-go/main.go plugins/agentic-engineering/scripts/autonomy-contract-go/main_test.go plugins/agentic-engineering/scripts/autonomy-contract-go/assessment_boundaries_test.go
          bash plugins/agentic-engineering/scripts/assess-autonomy.test.sh

      - name: 🧪 Self-test the Go guidance decoder
        run: |
          GOENV=off GOWORK=off GO111MODULE=off GOTOOLCHAIN=local GOFLAGS='' CGO_ENABLED=0 \
            go test scripts/gh-json-go/main.go scripts/gh-json-go/main_test.go

      - name: 🧪 Self-test the version-bump tools
        # Proves check-plugin-version-bump.sh PASSES what it must not block (a bumped
        # plugin, a new plugin, a deleted plugin, an unrelated change) and FAILS every
        # drift it exists to catch — including a second unbumped plugin in the same
        # change, which an early-exit refactor would silently hide.
        # Run every suite even when the first fails, retaining a failed job result.
        # This exposes guard and updater regressions together without masking either.
        run: |
          result=0
          ./scripts/check-plugin-version-bump.test.sh || result=1
          ./scripts/bump-plugin-version.test.sh || result=1
          bash scripts/plugin-version-boundaries.test.sh || result=1
          exit "$result"

      - name: 🧪 Self-test validator installation recovery
        run: bash scripts/install-skills-ref.test.sh

      - name: 🧪 Verify marketplace caller checkout isolation
        run: bash scripts/marketplace-caller-context.test.sh

      - name: 🧪 Self-test marketplace release preparation
        run: bash scripts/prepare-marketplace-release.test.sh

      - name: 🧪 Verify original release observations and reserved output writes
        run: bash scripts/release-observation-boundaries.test.sh

      - name: 🧪 Self-test marketplace release verification
        run: bash scripts/verify-marketplace-release.test.sh

      - name: 🧪 Self-test historical marketplace inspection
        run: bash scripts/inspect-marketplace-release.test.sh

      - name: 🧪 Self-test complete marketplace observations
        run: bash scripts/marketplace-observation-completeness.test.sh

      - name: 🧪 Self-test marketplace version proposals
        run: bash scripts/check-marketplace-version.test.sh

      - name: 🧪 Self-test remote marketplace release assessment
        run: bash scripts/check-marketplace-release-remote.test.sh

      - name: 🧪 Self-test marketplace publication
        run: bash scripts/publish-marketplace-release.test.sh

      - name: 🧪 Self-test merged marketplace preparation and exact main CI
        run: bash scripts/prepare-merged-marketplace-release.test.sh

      - name: 🧪 Self-test marketplace workflow authorization branches
        run: bash scripts/marketplace-publication-workflow.test.sh

      - name: 🧪 Self-test create-only marketplace proposals
        run: bash scripts/propose-marketplace-release.test.sh

      - name: 🧪 Self-test marketplace proposal workflow boundaries
        run: bash scripts/marketplace-proposal-workflow.test.sh

      - name: Verify the native Actions proposal identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api graphql --hostname github.com -f query='query { viewer { login } }' > "$RUNNER_TEMP/native-proposal-identity.json"
          jq '{login: .data.viewer.login}' "$RUNNER_TEMP/native-proposal-identity.json"
          jq -e '.data.viewer.login == "github-actions[bot]"' "$RUNNER_TEMP/native-proposal-identity.json"

      - name: 🧪 Self-test the open-PR recheck
        # Proves recheck-open-prs.sh re-triggers each open PR in the one order that is safe
        # (close BEFORE reopen), never leaves a PR closed when a step fails mid-sequence,
        # restores an armed auto-merge without arming one that was not, and fails closed on
        # an unparseable listing rather than reading it as "no open PRs". Hermetic: `gh` is
        # stubbed on PATH, so nothing reaches the network or touches a real pull request.
        run: ./scripts/recheck-open-prs.test.sh

      - name: 🧪 Verify PR recheck observations and recovery
        env:
          RECHECK_OBSERVATION_ARTIFACT_DIR: ${{ runner.temp }}/recheck-observation-recovery
        run: bash scripts/recheck-open-prs-observations.test.sh

      - name: 📦 Verify hosted recovery artifact collection
        if: ${{ always() }}
        # Synthetic PR settings from the hermetic test exercise the same collection as the caller.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recheck-recovery-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/recheck-observation-recovery/**/rearm/**
            ${{ runner.temp }}/recheck-observation-recovery/**/closed/**
          if-no-files-found: error
          retention-days: 14

      - name: 🧪 Self-test head-checked PR base refreshes
        run: bash scripts/recheck-open-prs-base-refresh.test.sh

      - name: 🧪 Self-test changelog generation and publication checks
        run: bash scripts/plugin-changelog.test.sh

      - name: 🧪 Verify changelog observation and recovery boundaries
        run: bash scripts/plugin-changelog-boundaries.test.sh

      - name: 🧪 Verify release artifact identity and write boundaries
        run: bash scripts/plugin-changelog-release-boundaries.test.sh

      - name: 🧪 Verify updater dispatch scopes
        run: bash scripts/skill-update-scope.test.sh

      - name: 🧪 Self-test the manifest guard
        # Proves validate-manifests.sh PASSES a consistent fixture and FAILS each
        # drift scenario it exists to catch (malformed/desynced manifests, every
        # plugin.json completeness rule, every manifest↔plugins lockstep rule), so
        # a refactor that silently weakens a check is caught here — not by a broken
        # plugin reaching consumers. Self-contained: throwaway fixtures, no network.
        run: ./scripts/validate-manifests.test.sh

      - name: 🧪 Verify bundled MCP configuration boundaries
        run: bash scripts/mcp-boundaries.test.sh

      - name: 🧪 Verify package identities and component paths
        run: bash scripts/package-boundaries.test.sh

      - name: 🧪 Verify complete packaged resource discovery
        run: bash scripts/package-discovery.test.sh

      - name: 🧪 Self-test the desired-state digest generator
        # Proves the generator writes exactly what validate-manifests.sh demands — a
        # generator that disagreed with the gate would leave a sync branch just as
        # unmergeable as having none. Asserts the coupling against the REAL validator on
        # a copy of this tree, keeps the two hashing rules distinct (definition files
        # normalize CRLF, executed runtime assets do not), and proves every unresolvable
        # digest fails closed rather than being written wrong.
        run: |
          result=0
          ./scripts/refresh-desired-state-digests.test.sh || result=1
          bash scripts/digest-declarations.test.sh || result=1
          exit "$result"

      - name: 🧪 Verify generated-write recovery
        run: bash scripts/generated-write-safety.test.sh

      - name: 🧪 Self-test the bundled-skill edit guard
        # Proves the guard FAILS a hand-edit to a synced skill tree and names its
        # upstream, PASSES the programmed sync (actor AND branch), passes a wholly
        # new skill directory and every authored path, reads provenance at the BASE
        # ref so stripping the line at head cannot disable it, and treats missing CI
        # context as UNKNOWN rather than a pass.
        run: ./scripts/guard-bundled-skill-edits.test.sh

      - name: 🧪 Self-test the gh JSON field guard
        # Proves every known formatting of an invalid `--json …merged…` request is caught
        # (including a JSON \u escape and a nested skill file), that mergedAt/mergedBy/
        # mergeCommit and adjacent prose are never reported, and that an unparseable
        # surface or an empty scan reads as UNKNOWN rather than clean.
        run: ./scripts/guard-gh-json-fields.test.sh

      - name: 🔍 Refuse a nonexistent gh JSON field in bundled definitions
        # `merged` exists on no gh PR command, and one unknown field voids the whole
        # request, so an agent told to read it cannot confirm its own merge. Checked here,
        # where definitions are authored and synced skills arrive, before any consumer pins it.
        run: ./scripts/guard-gh-json-fields.sh

      - name: 🧪 Self-test bundled helper scripts
        # Runs every hermetic *.test.sh bundled with a plugin — beside a skill
        # (plugins/*/skills/*/scripts/) or serving the plugin's agents
        # (plugins/*/scripts/) — so a regression in a script that ships to users is
        # caught here rather than mid-audit. New script tests are picked up
        # automatically — no workflow edit needed. Self-contained: each test stubs
        # its external tools (no network, no cluster).
        run: |
          shopt -s nullglob
          helpers=(plugins/*/scripts/*.sh plugins/*/skills/*/scripts/*.sh)
          tests=(plugins/*/scripts/*.test.sh plugins/*/skills/*/scripts/*.test.sh)

          # Running whatever tests exist would stay green for a helper that ships
          # with none — an unrelated test carries the step. Pair them explicitly,
          # over BOTH helper locations: a check scoped to one of them lets a new
          # helper in the other ship untested while CI stays green.
          missing=0
          for helper in "${helpers[@]}"; do
            case "$helper" in *.test.sh) continue ;; esac
            [ -f "${helper%.sh}.test.sh" ] && continue
            echo "::error file=$helper::No adjacent self-test (${helper%.sh}.test.sh)."
            missing=1
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          if [ ${#tests[@]} -eq 0 ]; then
            echo "No bundled helper scripts, and so no self-tests to run."
            exit 0
          fi
          for t in "${tests[@]}"; do
            echo "::group::$t"
            bash "$t"
            echo "::endgroup::"
          done

  check-version-bump:
    name: Check version bump
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 📄 Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # The guard diffs against the base commit, so it needs real history — a
          # shallow checkout would make it fail closed on every run.
          fetch-depth: 0

      - name: 🔧 Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: 📦 Install the locked Markdown parser
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: 🔢 Verify changed plugins moved their version
        # Consumers cache plugins by <marketplace>/<plugin>/<version>, so shipping a
        # content change on an unchanged version is unreachable for anyone who already
        # installed it. This is a PR gate: on a push to main the change has already
        # merged, so an absent base is reported and passed rather than failing the branch.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "No usable base commit for this event — skipping (PR gate only)."
            exit 0
          fi
          ./scripts/check-plugin-version-bump.sh "$BASE_SHA" HEAD
          bash scripts/plugin-changelog.sh check "$BASE_SHA" HEAD

      - name: 🔢 Verify the marketplace version proposal
        # A published tag occupies the version, so this prepublication gate belongs
        # to PRs only. Use the actual head, never GitHub's synthetic merge commit.
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/check-marketplace-version.sh "$BASE_SHA" "$HEAD_SHA"

  check-bundled-skill-edits:
    name: Check bundled skill edits
    runs-on: ubuntu-latest
    # 🔴 PULL REQUESTS ONLY. On a push to main there is no PR context — `head_ref` and
    # `pull_request.user.login` are both empty — but `github.event.before` IS populated,
    # so a base-only skip does NOT fire and the guard reaches its missing-context check
    # and exits 2 (UNKNOWN, fail-closed). That turns main red on the first sync merge
    # after this lands: the guard would break the branch for precisely the writer it was
    # built to permit. The decision this job makes is only meaningful pre-merge anyway.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: 📄 Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # The guard diffs against the base commit and reads the base copy of each
          # touched SKILL.md, so it needs real history.
          fetch-depth: 0

      - name: 🚫 Refuse hand-edits to bundled skill trees
        # Bundled skills are pulled from other people's repositories, and the daily
        # sync re-pulls them — so an edit committed here is reverted with no conflict
        # and no signal. This turns that silent revert into a failure that names the
        # upstream to fix it in.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # 🔴 DIFF AGAINST THE PR's OWN HEAD, NOT `HEAD`. `actions/checkout` checks out
          # `refs/pull/N/merge` for a pull_request event, so `HEAD` is the merge commit
          # and `merge-base(base.sha, HEAD)` IS base.sha — meaning `BASE_SHA...HEAD`
          # includes everything else merged into main since this PR branched. A PR that
          # touches only its own files would then be failed for a bundled edit somebody
          # else merged, on every open PR whose base predates a sync, i.e. daily. A guard
          # that cries wolf daily gets routed around, which is its own security problem.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_ACTOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          # The default step shell is `bash -e` WITHOUT pipefail, so the pipeline below
          # would report only the guard's status: a failed `git diff` would print nothing,
          # the guard would see no paths, and "no bundled skill tree touched" would be
          # reported for a diff that never ran. Fail closed on the producer instead.
          set -o pipefail
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null ||
             ! git cat-file -e "$HEAD_SHA^{commit}" 2>/dev/null; then
            echo "::error::base or head commit is unreadable, so bundled-skill edits cannot be judged"
            exit 2
          fi
          # -z: emit paths raw. `--name-only` alone quotes non-ASCII, spaces and quotes,
          # and a quoted path matches none of the guard's anchored patterns, so the file
          # is dropped unchecked — a bypass the attacker names their own file to trigger.
          #
          # --no-renames: with rename detection on (the default), moving a file OUT of a
          # bundled skill tree reports only the DESTINATION, so the synced path never
          # reaches the guard and the removal passes unseen — then the next sync restores
          # it, which is the silent revert this whole job exists to catch. Reproduced:
          # `git mv plugins/p/skills/s/references/z.md docs/z.md` lists just `docs/z.md`
          # by default, and both paths with this flag. The bypass is in the producer, not
          # the guard, so it is closed here.
          git diff -z --no-renames --name-only "$BASE_SHA...$HEAD_SHA" |
            ./scripts/guard-bundled-skill-edits.sh --null

  discover-skills:
    name: Discover skills
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      skills: ${{ steps.list.outputs.skills }}
    steps:
      - name: 📄 Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: 📂 List skill directories
        id: list
        run: |
          skills=$(find plugins -mindepth 4 -maxdepth 4 -name SKILL.md -printf '%h\n' \
            | sed 's|^\./||' \
            | sort \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          if ! jq -e 'type == "array"' >/dev/null 2>&1 <<<"$skills"; then
            echo "::error::Skill discovery produced invalid output."
            exit 1
          fi
          echo "skills=$skills" >> "$GITHUB_OUTPUT"
          echo "Discovered: $skills"

  validate-spec:
    name: Validate spec (${{ matrix.skill }})
    needs: discover-skills
    if: needs.discover-skills.outputs.skills != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        skill: ${{ fromJson(needs.discover-skills.outputs.skills) }}
    steps:
      - name: 📄 Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: 🐍 Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: 📦 Install skills-ref
        env:
          AGENTSKILLS_REF: 8d8fcbc69e0c42e05922c2ffc287a3bbdef7b0a3
        run: bash scripts/install-skills-ref.sh

      - name: ✅ Validate ${{ matrix.skill }} against agentskills.io spec
        env:
          SKILL: ${{ matrix.skill }}
        run: skills-ref validate "$SKILL"

  retired-repo-links:
    name: Retired repository links
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check active documentation
        id: links
        uses: devantler-tech/.github/actions/validate-retired-repo-links@bd0035dd8f41fcf1459b878882b8897443f8dc59 # v4.9.4
        with:
          enabled: "true"
      - name: Require a completed scan
        env:
          VALIDATED: ${{ steps.links.outputs.validated }}
        run: test "$VALIDATED" = true
      - name: Check out the exact validator for refusal controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: devantler-tech/.github
          ref: bd0035dd8f41fcf1459b878882b8897443f8dc59 # v4.9.4
          path: .retired-link-validator-source
          persist-credentials: false
      - name: Prove retired links and incomplete scans fail
        env:
          GOWORK: off
          GOFLAGS: ""
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          control=$(mktemp -d "$RUNNER_TEMP/retired-links.XXXXXX")
          trap 'rm -rf "$control"' EXIT
          mkdir "$control/.github"
          cp .github/retired-repo-links.json "$control/.github/"
          cp README.md AGENTS.md "$control/"
          go -C .retired-link-validator-source/actions/validate-retired-repo-links build -mod=readonly -trimpath -o "$control/validator" .
          printf '\nhttps://github.com/devantler-tech/reusable-workflows\n' >>"$control/README.md"
          status=0
          "$control/validator" --root "$control" >"$control/negative.log" 2>&1 || status=$?
          test "$status" = 1 || { cat "$control/negative.log"; exit 1; }
          grep -Eq '^README.md:[0-9]+: link targets retired repository devantler-tech/reusable-workflows$' "$control/negative.log"
          rm "$control/.github/retired-repo-links.json"
          status=0
          "$control/validator" --root "$control" >"$control/missing.log" 2>&1 || status=$?
          test "$status" = 2 || { cat "$control/missing.log"; exit 1; }
          grep -q '^Invalid configuration:' "$control/missing.log"
          echo 'PASS: clean scan, seeded retired link rejection, and missing configuration refusal'

  ci-required-checks:
    name: CI - Required Checks
    runs-on: ubuntu-latest
    permissions:
      checks: read
      statuses: read
      pull-requests: read
    timeout-minutes: 5
    needs: [retired-repo-links, validate-manifests, lint-scripts, check-version-bump, check-bundled-skill-edits, discover-skills, validate-spec]
    if: ${{ always() }}
    steps:
      - uses: devantler-tech/.github/actions/aggregate-job-checks@4b00bd6698af033dc472b39a7e609173fe38dfb1 # v6.0.6
        with:
          job-results: >-
            ${{ needs.retired-repo-links.result }}
            ${{ needs.validate-manifests.result }}
            ${{ needs.lint-scripts.result }}
            ${{ needs.check-version-bump.result }}
            ${{ needs.check-bundled-skill-edits.result }}
            ${{ needs.discover-skills.result }}
            ${{ needs.validate-spec.result }}
