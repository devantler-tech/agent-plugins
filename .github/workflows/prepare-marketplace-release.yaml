name: 📦 Prepare marketplace release

on:
  workflow_dispatch:
    inputs:
      base-tag:
        description: Last stable marketplace tag, or initial for the first release
        required: true
        type: string

permissions: {}

jobs:
  prepare:
    name: Prepare review artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout selected revision and complete tag history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate repository manifests
        run: bash scripts/validate-manifests.sh

      - name: Prepare the release candidate
        env:
          BASE_TAG: ${{ inputs.base-tag }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          bash scripts/prepare-marketplace-release.sh \
            --base-tag "$BASE_TAG" --head "$SOURCE_COMMIT" \
            --output "$RUNNER_TEMP/marketplace-release"

      - name: Upload the review artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: marketplace-release-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/marketplace-release
          if-no-files-found: error
          # The generated directory contains only the plan, notes, and two public manifests.
          include-hidden-files: true
          retention-days: 14
