name: 🔄 Update Agent Skills

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Skills to synchronize
        type: choice
        default: all
        options:
          - all
          - agentic-engineering
          - engineering-practices
  schedule:
    - cron: "0 6 * * *"

permissions: {}

# All scopes can update the same per-skill branches. Keep their digest/version
# follow-ups inside the same non-cancelling queue as the updater itself.
concurrency:
  group: agent-plugins-skill-sync-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  scope:
    name: Resolve the requested skill scope
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      dir: ${{ steps.scope.outputs.dir }}
      branch: ${{ steps.scope.outputs.branch }}
      pins: ${{ steps.scope.outputs.pins }}
    steps:
      - name: 📄 Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Resolve the declared scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          SKILL_SCOPE: ${{ inputs.scope }}
        run: bash scripts/skill-update-scope.sh "$EVENT_NAME" "$SKILL_SCOPE" >> "$GITHUB_OUTPUT"

  update:
    needs: scope
    permissions:
      contents: write # The shared updater writes the signed skill-sync commits.
      pull-requests: write # The shared updater opens per-skill update proposals.
    uses: devantler-tech/update-agent-skills-action/.github/workflows/update-agent-skills.yaml@61bf88c1a9567700ff7aa1ff18a4c167430e4b13 # candidate; verified release required before merge
    with:
      dir: ${{ needs.scope.outputs.dir }}
      pr-branch: ${{ needs.scope.outputs.branch }}
      pins: ${{ needs.scope.outputs.pins }}
      # One PR per changed skill, from `deps/agent-skills-update-<slug>`, so a skill whose
      # update is blocked (a review finding, a failing check) holds back only itself instead
      # of every other skill's update (#175). The bundled-skill edit guard exempts each such
      # branch for its own skill only.
      pr-per-skill: true
      # Create the update PR with a GitHub App token so it triggers this
      # repo's required CI (a PR opened with GITHUB_TOKEN does not), instead
      # of landing permanently blocked on missing required checks.
      use-app-token: true
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  # A skill sync changes shipped plugin content, and two repository gates then reject the
  # branch the sync produced. Consumers cache plugins by version, so without a matching
  # version bump the update is unreachable for everyone who already installed that
  # version, and `Check version bump` rejects it. A synced agent or skill also moves a
  # content digest that `Validate manifests` pins, and nothing else in this repository
  # writes those digests — so without the refresh the branch is only greenable by a hand
  # edit, which the next sync force-pushes away with no signal that it happened. The sync
  # workflow that opens the PR has no post-update hook, so the digest, version and dated
  # changelog updates land here as follow-up commits on the same branch.
  #
  # Each per-skill PR gets its own follow-up. Two PRs that change skills in the same plugin
  # both bump that plugin from main's version, so whichever merges second conflicts on the
  # version; the next daily run rebuilds its branch from the new main and bumps it again.
  bump-versions:
    name: Refresh digests and release notes for ${{ matrix.skill.path }}
    needs: [scope, update]
    if: ${{ needs.update.outputs.skills != '' && needs.update.outputs.skills != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        skill: ${{ fromJSON(needs.update.outputs.skills) }}
    permissions:
      contents: read
    steps:
      - name: 🔑 Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      - name: 📄 Checkout the reviewed publisher and generators
        id: trusted-tools
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          path: trusted-tools
          persist-credentials: false

      - name: 📄 Checkout the update branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.scope.outputs.branch }}-${{ matrix.skill.slug }}
          path: update
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
        # The sync opens a PR only when an upstream skill actually drifted; on a quiet day
        # the branch does not exist and there is nothing to bump.
        continue-on-error: true
        id: checkout

      - name: 🔧 Set up Node.js
        if: steps.checkout.outcome == 'success'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: 📦 Install the locked Markdown parser
        if: steps.checkout.outcome == 'success'
        working-directory: trusted-tools
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: 🔐 Generate the scoped metadata changes
        if: steps.checkout.outcome == 'success'
        working-directory: update
        run: |
          bash "$GITHUB_WORKSPACE/trusted-tools/scripts/refresh-desired-state-digests.sh"
          # Checkout supplies history; explicitly bind the comparison ref as well.
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          bash "$GITHUB_WORKSPACE/trusted-tools/scripts/bump-plugin-version.sh" --changed-since origin/main
          bash "$GITHUB_WORKSPACE/trusted-tools/scripts/plugin-changelog.sh" write origin/main
          # The publisher independently rejects anything outside this skill's plugin metadata.
          git add -- '*.desired-state.json'
          git add -- .claude-plugin/marketplace.json .github/plugin/marketplace.json \
            'plugins/*/plugin.json' 'plugins/*/.claude-plugin/plugin.json' 'plugins/*/CHANGELOG.md'

      - name: ✍️ Publish one App-signed metadata commit
        id: publish-metadata
        if: steps.checkout.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SKILL_PATH: ${{ matrix.skill.path }}
          SKILL_BRANCH: ${{ needs.scope.outputs.branch }}-${{ matrix.skill.slug }}
        run: |
          bash "$GITHUB_WORKSPACE/trusted-tools/scripts/publish-skill-metadata.sh" \
            --repo-dir "$GITHUB_WORKSPACE/update" --skill-path "$SKILL_PATH" --branch "$SKILL_BRANCH"
