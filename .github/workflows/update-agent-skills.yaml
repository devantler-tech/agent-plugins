name: 🔄 Update Agent Skills

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    uses: devantler-tech/actions/.github/workflows/update-agent-skills.yaml@061b345a7351b0caf23055caea63ccd08b75e20e # v8.0.0
    with:
      dir: plugins
      # Create the update PR with a GitHub App token so it triggers this
      # repo's required CI (a PR opened with GITHUB_TOKEN does not), instead
      # of landing permanently blocked on missing required checks.
      use-app-token: true
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  # A skill sync changes shipped plugin content, and two repository gates then reject the
  # branch the sync produced. Consumers cache plugins by version, so without a matching
  # version bump the update is unreachable for everyone who already installed that
  # version, and `Check version bump` rejects it. A synced agent or skill also moves a
  # content digest that `Validate manifests` pins, and nothing else in this repository
  # writes those digests — so without the refresh the branch is only greenable by a hand
  # edit, which the next sync force-pushes away with no signal that it happened. The sync
  # workflow that opens the PR has no post-update hook, so both land here as follow-up
  # commits on the same branch.
  bump-versions:
    name: Refresh digests and bump versions of changed plugins
    needs: update
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 🔑 Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      - name: 📄 Checkout the update branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: deps/agent-skills-update
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          # This job must push, so credentials stay on the checkout.
          persist-credentials: true
        # The sync opens a PR only when an upstream skill actually drifted; on a quiet day
        # the branch does not exist and there is nothing to bump.
        continue-on-error: true
        id: checkout

      - name: 🔐 Refresh the desired-state digests the sync moved
        if: steps.checkout.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ./scripts/refresh-desired-state-digests.sh
          if git diff --quiet; then
            echo "Declared digests already match the synced content."
            exit 0
          fi
          # Stage only what the generator is allowed to touch, so an unrelated working-tree
          # change could never ride along in this commit.
          git add -- '*.desired-state.json'
          git commit -m "chore(deps): refresh desired-state digests for synced content"
          git push origin HEAD:deps/agent-skills-update

      - name: 🔢 Bump every plugin whose content changed
        if: steps.checkout.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Be explicit rather than relying on fetch-depth to have populated the
          # remote-tracking ref — without origin/main the bump has no base to diff against.
          git fetch --no-tags origin main
          ./scripts/bump-plugin-version.sh --changed-since origin/main
          if git diff --quiet; then
            echo "No version bump needed."
            exit 0
          fi
          git commit -am "chore(deps): bump versions of changed plugins"
          git push origin HEAD:deps/agent-skills-update
